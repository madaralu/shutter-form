<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نموذج بيانات الشيش</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#172033;background:#f4f6fa} :root{--brand-orange:#f7941d;--brand-black:#171717}
*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:1100px;margin:auto}.brand-banner{display:block;width:100%;height:auto;max-height:250px;object-fit:cover;object-position:center;border-radius:14px;margin-bottom:14px;border:1px solid #e1e6ef}.brand-accent{height:5px;background:#f7941d;border-radius:5px;margin:0 0 14px}
header,.panel,.rowcard{background:#fff;border:1px solid #e1e6ef;border-radius:14px;padding:16px;margin-bottom:14px}
h1{font-size:23px;margin:0 0 8px}p{line-height:1.7;margin:6px 0;color:#526078}
.topgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd3df;border-radius:9px;font:inherit;background:#fff;min-width:0}
input[type=number]{direction:ltr;text-align:right}
.rowhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.rowhead h2{font-size:17px;margin:0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.span2{grid-column:1/-1}.btns{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font-weight:700}
.primary{background:var(--brand-orange);color:#171717}.secondary{background:#e8eef7;color:#17314f}.danger{background:#fff0f0;color:#a12525}
small,.hint{font-size:12px;color:#637087}.count{font-weight:700;color:#c96c00}
.walink{display:inline-block;margin-top:10px;background:#25d366;color:#fff;font-weight:700;text-decoration:none;border-radius:10px;padding:12px 16px}.walink[hidden]{display:none}
footer{padding:8px 2px 22px;color:#5b6578;font-size:12px}
@media(min-width:760px){.fields{grid-template-columns:repeat(5,minmax(0,1fr))}.fields .wide{grid-column:span 2}.fields .notes{grid-column:span 2}.fields .span2{grid-column:span 2}}
@media(max-width:420px){body{padding:9px}.topgrid{grid-template-columns:1fr}.panel,.rowcard,header{padding:12px}.fields{gap:10px}}
</style>
</head>

<script>

   ===================================================================== */
const CFG = {
  // عنوان النموذج الظاهر في اعلى الصفحة

  // عناوين الاعمدة في ملف Excel
  headers: ["م", "نوع الشريحة ", "اللون", "عرض (سم)", "ارتفاع ( سم )", "العدد", "طريقة التركيب", "طريقة التحريك", "طريقة التشغيل", "ملاحظات"],

  options: {

    slat: [

    ],

    // ----- طريقة التركيب -----
    installation: [

    ],

    // ----- طريقة التحريك -----
    movement: [
      "محرك بيكر - ألماني",
      "محرك سومفي - فرنساوي",
      "محرك جابوسا - إيطالي",
      "محرك روزا  - إيطالي",

    ],

    // ----- طريقة التشغيل -----
    operation: [

      "مفتاح وايرلس",

  colors: [

    "أسود 131",

    "لون خاص",
    "خشبي",
    "فضي 103"
  ]
};
document.title = CFG.title;
document.getElementById('formTitle').textContent = CFG.title;
const MAX=50, rowsRoot=document.getElementById('rows');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function selectOptions(vals,placeholder){return `<option value="">${esc(placeholder)}</option>`+vals.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
function makeRow(n,record={}){
 const card=document.createElement('div');card.className='rowcard';card.dataset.row='';
 card.innerHTML=`<div class="rowhead"><h2>شيش رقم ${n}</h2>${n>1?'<button type="button" class="danger remove">حذف</button>':''}</div>
 <div class="fields">
 <div><label>نوع الشريحة</label><select data-key="slat">${selectOptions(CFG.options.slat,'اختر نوع الشريحة')}</select></div>
 <div><label>اللون</label><select data-key="color">${selectOptions(CFG.colors,'اختر اللون')}</select><input data-key="colorCustom" placeholder="اكتب اللون المطلوب" style="margin-top:8px" hidden></div>
 <div><label>العرض (سم)</label><input data-key="width" type="number" min="0" step="any" inputmode="decimal" placeholder="العرض"></div>
 <div><label>الارتفاع (سم)</label><input data-key="height" type="number" min="0" step="any" inputmode="decimal" placeholder="الارتفاع"></div>
 <div><label>العدد</label><input data-key="qty" type="number" min="1" step="1" inputmode="numeric" value="1"></div>
 <div class="wide"><label>طريقة التركيب</label><select data-key="installation">${selectOptions(CFG.options.installation,'اختر طريقة التركيب')}</select></div>
 <div class="wide"><label>طريقة التحريك</label><select data-key="movement">${selectOptions(CFG.options.movement,'اختر طريقة التحريك')}</select></div>
 <div class="wide"><label>طريقة التشغيل</label><select data-key="operation">${selectOptions(CFG.options.operation,'اختر طريقة التشغيل')}</select></div>
 <div class="notes"><label>ملاحظات</label><input data-key="notes" placeholder="ملاحظات إضافية (اختياري)"></div>
 </div>`;
 for(const [key,value] of Object.entries(record)){const el=card.querySelector(`[data-key="${key}"]`);if(el)el.value=value??''}
 toggleCustomColor(card);
 card.querySelector('.remove')?.addEventListener('click',()=>{card.remove();renumber()});
 return card;
}

const CUSTOM_COLOR='لون خاص';
function toggleCustomColor(card){const sel=card.querySelector('[data-key="color"]'),box=card.querySelector('[data-key="colorCustom"]');const on=sel.value===CUSTOM_COLOR;box.hidden=!on;if(!on)box.value=''}
function renumber(){[...rowsRoot.children].forEach((c,i)=>{c.querySelector('h2').textContent=`شيش رقم ${i+1}`;const b=c.querySelector('.remove');if(b)b.style.display=rowsRoot.children.length===1?'none':''});document.getElementById('count').textContent=rowsRoot.children.length;document.getElementById('add').disabled=rowsRoot.children.length>=MAX}
function addRow(record){if(rowsRoot.children.length>=MAX)return;rowsRoot.appendChild(makeRow(rowsRoot.children.length+1,record));renumber()}
addRow();
rowsRoot.addEventListener('change',e=>{if(e.target.matches('[data-key="color"]'))toggleCustomColor(e.target.closest('[data-row]'))});
document.getElementById('add').addEventListener('click',()=>addRow());
function val(card,key){return card.querySelector(`[data-key="${key}"]`)?.value?.trim()||''}
function getRecords(){
 const cards=[...rowsRoot.children],out=[];
 for(let i=0;i<cards.length;i++){
  const c=cards[i],r={slat:val(c,'slat'),color:(val(c,'color')===CUSTOM_COLOR&&val(c,'colorCustom'))?`${CUSTOM_COLOR} - ${val(c,'colorCustom')}`:val(c,'color'),width:val(c,'width'),height:val(c,'height'),qty:val(c,'qty'),installation:val(c,'installation'),movement:val(c,'movement'),operation:val(c,'operation'),notes:val(c,'notes')};
  if(![r.slat,r.color,r.width,r.height,r.installation,r.movement,r.operation,r.notes].some(v=>v!==''))continue;
  if(!r.slat){throw new Error(`يرجى اختيار نوع الشريحة في الصف ${i+1}`)}
  if(!r.width||!r.height||Number(r.width)<=0||Number(r.height)<=0){throw new Error(`يرجى إدخال عرض وارتفاع صحيحين في الصف ${i+1}`)}
  if(!r.qty||!Number.isInteger(Number(r.qty))||Number(r.qty)<1){throw new Error(`يرجى إدخال عدد صحيح في الصف ${i+1}`)}
  out.push(r);
 }
 if(!out.length)throw new Error('أدخل بيانات شيش واحد على الأقل.');
 return out;
}
function xmlEscape(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function colName(n){let s='';while(n){let r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s}
function makeSheetXml(matrix){
 let body='';
 matrix.forEach((row,ri)=>{let cells='';row.forEach((v,ci)=>{if(v===null||v===undefined||v==='')return;let ref=colName(ci+1)+(ri+1);const style=ri===0?' s="1"':'';if(typeof v==='number'&&Number.isFinite(v)){cells+=`<c r="${ref}"${style}><v>${v}</v></c>`}else{cells+=`<c r="${ref}"${style} t="inlineStr"><is><t xml:space="preserve">${xmlEscape(v)}</t></is></c>`}});body+=`<row r="${ri+1}"${ri===0?' ht="30" customHeight="1"':''}>${cells}</row>`});
 const maxCol=Math.max(...matrix.map(r=>r.length),1);return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><dimension ref="A1:${colName(maxCol)}${matrix.length}"/><sheetViews><sheetView workbookViewId="0" rightToLeft="1"/></sheetViews><sheetFormatPr defaultRowHeight="20"/><sheetData>${body}</sheetData><autoFilter ref="A1:${colName(maxCol)}${matrix.length}"/></worksheet>`;
}
function makeExportMatrix(records){
 const matrix=[CFG.headers];
 records.forEach((r,i)=>matrix.push([i+1,r.slat,r.color,r.width?Number(r.width):'',r.height?Number(r.height):'',r.qty?Number(r.qty):'',r.installation,r.movement,r.operation,r.notes]));
 return matrix;
}
const encoder=new TextEncoder();
function crc32(bytes){let crc=-1;for(const b of bytes){crc^=b;for(let k=0;k<8;k++)crc=(crc>>>1)^((crc&1)?0xEDB88320:0)}return (crc^-1)>>>0}
function u16(n){return [n&255,(n>>>8)&255]}function u32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}
function zipStore(files){
 const locals=[],centrals=[];let offset=0;
 for(const f of files){const name=encoder.encode(f.name),data=encoder.encode(f.data),crc=crc32(data);
  const local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...name,...data]);locals.push(local);
  const central=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...name]);centrals.push(central);offset+=local.length;
 }
 const centralSize=centrals.reduce((a,c)=>a+c.length,0),end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(centralSize),...u32(offset),...u16(0)]);
 return new Blob([...locals,...centrals,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function generateExcel(mode){
 const status=document.getElementById('status');status.textContent='';status.style.color='';document.getElementById('openWa').hidden=true;
 try{
  const records=getRecords(),matrix=makeExportMatrix(records);
  const now=new Date().toISOString().slice(0,10);
  const files=[
   {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},
   {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
   {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets><sheet name="بيانات الشيش" sheetId="1" r:id="rId1"/></sheets></workbook>`},
   {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
   {name:'xl/styles.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Arial"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Arial"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF7941D"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFFFFFFF"/></left><right style="thin"><color rgb="FFFFFFFF"/></right><top style="thin"><color rgb="FFFFFFFF"/></top><bottom style="thin"><color rgb="FFFFFFFF"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},
   {name:'xl/worksheets/sheet1.xml',data:makeSheetXml(matrix)}
  ];
  const blob=zipStore(files);
  const fileName=`Quote_Request_${now}.xlsx`;
  if(mode==='share')return {blob,fileName,records};
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
  status.textContent=`تم تنزيل ملف Excel بعدد ${records.length} صفوف. لإرساله في واتساب، أرفقه من مجلد التنزيلات.`;
 }catch(e){status.textContent=e.message;status.style.color='#a12525'}
}
function makeCsv(records){
 const rows=[];
 rows.push(...makeExportMatrix(records));
 const cell=v=>{const s=String(v??'');return /[",\r\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s};
 return '﻿'+rows.map(r=>r.map(cell).join(',')).join('\r\n');
}
async function shareViaWhatsApp(){
 const out=generateExcel('share');
 if(!out)return;
 const status=document.getElementById('status');
 const android=/Android/i.test(navigator.userAgent);
 const file=android
  ?new File([makeCsv(out.records)],out.fileName.replace(/\.xlsx$/,'.csv'),{type:'text/csv'})
  :new File([out.blob],out.fileName,{type:out.blob.type});
 if(navigator.canShare&&navigator.canShare({files:[file]})){
  try{
   await navigator.share({files:[file],title:CFG.title});
   status.textContent='تمت مشاركة الملف.';
   return;
  }catch(e){
   if(e.name==='AbortError')return;
   if(e.name!=='NotAllowedError'){status.textContent=e.message;status.style.color='#a12525';return}
  }
 }
 generateExcel();
 status.textContent='تم تنزيل ملف Excel. اضغط "فتح واتساب" ثم أرفق الملف من مجلد التنزيلات.';
 const ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);
 const wa=document.getElementById('openWa');
 wa.href=android?'intent://send/#Intent;scheme=whatsapp;package=com.whatsapp;end':ios?'whatsapp://send':'https://web.whatsapp.com/';
 wa.target=android||ios?'_self':'_blank';
 wa.hidden=false;
}
document.getElementById('export').addEventListener('click',generateExcel);
document.getElementById('share').addEventListener('click',shareViaWhatsApp);
</script>
